# Snapshot (bless/check) case manifest — the single source of truth for the
# suite. Each `[[case]]` becomes one libtest-mimic trial (see tests/snapshots.rs)
# and one fixture under data/expected_outputs/. `scripts/check_all_outputs.py`
# reads the same file for each fixture's equivalence-oracle spec (`oracle`).
#
# Fields (see tests/common/mod.rs for the full schema):
#   name          unique, `/`-structured trial name
#   kind          run recipe: stitch | cogsci | dreamcoder | epfl
#   input / glob  corpus file, or (dreamcoder) a `dir/*.json` glob to aggregate
#   fixture       fixture path under data/expected_outputs/ (no .out.json);
#                 defaults to the input path minus `data/[domains/]` and `.json`
#   backends      stitch only: bf (default) | both  (both → collapse if they agree)
#   steps         best-first --num-steps override
#   rules         --rules <path> (also the default equivalence-oracle rules)
#   at_start      epfl only: pass --only-use-dsrs-at-start
#   check_pattern stitch only: keep the abstraction pattern/lambda (default true)
#   args          extra CLI args appended verbatim
#   oracle        equivalence check: "beta" (default) | "circuit" |
#                 { rules = "..." } | { skip = "reason" }
#
# Re-bless everything:  BLESS=1 cargo test --release --test snapshots

# ─── cogsci drawing domains (best-first, 3 stacked abstractions) ──────────────
# Four variants per domain: no-DSR, the per-domain babble DSRs, those DSRs under
# a --max-forced-expansion cap, and our algebraic drawings.rewrites under the
# --max-match-set cap. See the (former) tests/cogsci_bfs_test.rs header for the
# rationale behind each variant's budget.

[[case]]
name = "cogsci/dials.nodsr"
kind = "cogsci"
input = "data/domains/cogsci/dials.json"
fixture = "cogsci/dials.nodsr"
oracle = "beta"

[[case]]
name = "cogsci/dials.dsr"
kind = "cogsci"
input = "data/domains/cogsci/dials.json"
fixture = "cogsci/dials.dsr"
rules = "data/domains/cogsci/dials.rewrites"
oracle = { rules = "data/domains/cogsci/dials.rewrites" }

# dsr-mfe3: the forced-expansion prune fires on wheels/furniture (changing the
# result vs. the uncapped DSR run) and is a no-op on dials/nuts-bolts.
[[case]]
name = "cogsci/dials.dsr-mfe3"
kind = "cogsci"
input = "data/domains/cogsci/dials.json"
fixture = "cogsci/dials.dsr-mfe3"
rules = "data/domains/cogsci/dials.rewrites"
args = ["--max-forced-expansion", "3"]
oracle = { rules = "data/domains/cogsci/dials.rewrites" }

# algebra: our non-confluent drawings.rewrites under the per-factor match-set cap
# (24) + --decompose-min-rows 24 + --iter-limit 6, at a reduced 10000-step budget
# (50000 OOMs CI when the four domains run concurrently). Oracle-intractable
# (check_equiv saturates without the cap), so pinned only by this snapshot.
[[case]]
name = "cogsci/dials.algebra"
kind = "cogsci"
input = "data/domains/cogsci/dials.json"
fixture = "cogsci/dials.algebra"
rules = "data/domains/cogsci/drawings.rewrites"
steps = "10000"
args = ["--max-match-set", "24", "--decompose-min-rows", "24", "--iter-limit", "6"]
oracle = { skip = "oracle-intractable (non-confluent algebra rules); pinned by snapshot" }

