<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>egg-stitch results</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>egg-stitch results</h1>
<div class="sub" id="meta">loading…</div>
<table id="tbl">
  <thead><tr>
    <th data-k="timestamp">when</th>
    <th data-k="name">run</th>
    <th data-k="rewrites">rewrites</th>
    <th data-k="initial_cost">init cost</th>
    <th data-k="final_cost">final</th>
    <th data-k="compression_ratio">ratio</th>
    <th data-k="elapsed_secs">time (s)</th>
    <th data-k="arity">arity</th>
    <th data-k="pattern_size">pat size</th>
    <th data-k="num_matches">matches</th>
    <th data-k="usage_matches">usage matches</th>
    <th data-k="approx_cost">approx cost</th>
    <th data-k="num_expansions">expansions</th>
    <th data-k="best_iteration">best iter</th>
  </tr></thead>
  <tbody></tbody>
</table>
<div id="detail"></div>
<script src="analysis.js"></script>
</body>
</html>
