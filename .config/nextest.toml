[profile.default]
slow-timeout = { period = "2m", terminate-after = 1 }
fail-fast = false

[[profile.default.overrides]]
filter = "test(/check_slow/)"
slow-timeout = "2m"

# epfl_circuits_test runs SMC rollouts that can exceed the 2m default; warn at 4m,
# kill at 12m (hang backstop).
[[profile.default.overrides]]
filter = "binary(epfl_circuits_test)"
slow-timeout = { period = "4m", terminate-after = 3 }

# The cogsci `*_algebra` cases run the algebraic drawing rewrites and can exceed
# the 2m default; warn at 4m, kill at 12m (hang backstop).
[[profile.default.overrides]]
filter = "test(/_algebra$/)"
slow-timeout = { period = "4m", terminate-after = 3 }
