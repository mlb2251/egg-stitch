[profile.default]
slow-timeout = { period = "2m", terminate-after = 1 }
fail-fast = false

[[profile.default.overrides]]
filter = "test(/check_slow/)"
slow-timeout = "2m"

# The data-driven snapshot suite (tests/snapshots.toml) runs the search
# end-to-end — SMC rollouts on the EPFL circuits and the algebra cogsci variants
# are heavier than the 2m default. Warn at 4m, kill at 20m (hang backstop).
[[profile.default.overrides]]
filter = "binary(snapshots)"
slow-timeout = { period = "4m", terminate-after = 5 }
